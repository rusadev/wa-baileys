<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Baileys Gateway</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.35rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 12px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin: 10px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b1120; color: var(--text);
      font-size: 0.95rem;
    }
    textarea { min-height: 80px; resize: vertical; }
    button, .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 14px; border-radius: 8px; border: none;
      cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .btn-primary { background: var(--green); color: #052e16; }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-danger { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .btn-blue { background: rgba(56,189,248,0.15); color: var(--blue); border: 1px solid rgba(56,189,248,0.35); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .row-2 { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
    .alert { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; }
    .alert.ok { background: rgba(34,197,94,0.12); color: #86efac; }
    .alert.err { background: rgba(239,68,68,0.12); color: #fca5a5; }
    .badge {
      display: inline-flex; padding: 4px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
    }
    .badge.connected { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge.scan_qr { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge.connecting, .badge.disconnected { background: rgba(239,68,68,0.15); color: #f87171; }
    .device-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
    }
    .device-card { cursor: pointer; transition: border-color .15s; }
    .device-card:hover { border-color: var(--blue); }
    .device-card.active { border-color: var(--green); }
    .auth-wrap { max-width: 420px; margin: 60px auto; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button, .tab-btn { flex: 1; min-width: 140px; background: #334155; color: var(--text); border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .tabs button.active, .tab-btn.active { background: var(--green); color: #052e16; }
    button.primary, .btn-primary { background: var(--green); color: #052e16; width: 100%; margin-top: 12px; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b1120; color: var(--text);
      font-size: 0.95rem;
    }
    .qr-box {
      min-height: 220px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0b1120;
      border-radius: 10px; padding: 16px; text-align: center;
    }
    .qr-box img { width: 220px; height: 220px; background: #fff; border-radius: 8px; }
    .msg-list { max-height: 280px; overflow: auto; }
    .msg-item {
      padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .key-box {
      font-family: ui-monospace, monospace; font-size: 0.8rem;
      word-break: break-all; background: #0b1120; padding: 10px;
      border-radius: 8px; border: 1px dashed var(--border);
    }
    .nav-user { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <!-- AUTH -->
    <div id="authView" class="auth-wrap hidden">
      <div class="card">
        <h1 style="margin-bottom:8px;">WA Baileys Gateway</h1>
        <p class="muted" id="authHint">Login untuk mengelola device WhatsApp.</p>
        <div class="tabs" id="authTabs">
          <button type="button" class="btn-secondary active" id="tabLogin" onclick="showAuthTab('login')">Login</button>
          <button type="button" class="btn-secondary hidden" id="tabRegister" onclick="showAuthTab('register')">Daftar Super Admin</button>
        </div>
        <form id="loginForm" onsubmit="doLogin(event)">
          <label>Email</label>
          <input type="email" id="loginEmail" required />
          <label>Password</label>
          <input type="password" id="loginPassword" required minlength="8" />
          <div style="margin-top:14px;">
            <button class="btn-primary" type="submit" style="width:100%;">Masuk</button>
          </div>
          <div id="loginAlert" class="alert hidden"></div>
        </form>
        <form id="registerForm" class="hidden" onsubmit="doRegister(event)">
          <label>Nama</label>
          <input type="text" id="regName" required />
          <label>Email</label>
          <input type="email" id="regEmail" required />
          <label>Password (min. 8)</label>
          <input type="password" id="regPassword" required minlength="8" />
          <div style="margin-top:14px;">
            <button class="btn-primary" type="submit" style="width:100%;">Buat Super Admin</button>
          </div>
          <div id="regAlert" class="alert hidden"></div>
        </form>
      </div>
    </div>

    <!-- APP -->
    <div id="appView" class="hidden">
      <header>
        <div>
          <h1>WA Baileys Gateway</h1>
          <div class="nav-user" id="userLabel"></div>
        </div>
        <div class="row">
          <button class="btn-secondary" type="button" onclick="showSection('devices')">Devices</button>
          <button class="btn-secondary hidden" type="button" id="usersNavBtn" onclick="showSection('users')">Users</button>
          <button class="btn-danger" type="button" onclick="doLogout()">Logout</button>
        </div>
      </header>

      <!-- Devices list -->
      <section id="devicesSection">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:12px;">
            <h2 style="margin:0;">Devices WhatsApp</h2>
            <button class="btn-primary" type="button" onclick="createDevice()">+ Tambah Device</button>
          </div>
          <p class="muted" style="margin-bottom:12px;">Setiap device = 1 nomor WA + 1 API key unik untuk aplikasi eksternal.</p>
          <div id="deviceGrid" class="device-grid"></div>
        </div>

        <div id="deviceDetail" class="hidden">
          <div class="card">
            <div class="row" style="justify-content:space-between;margin-bottom:12px;">
              <h2 style="margin:0;" id="detailTitle">Device</h2>
              <span id="detailBadge" class="badge disconnected">—</span>
            </div>
            <div class="row-2">
              <div>
                <div class="qr-box" id="qrBox"><p class="muted">Memuat…</p></div>
                <div class="row" style="margin-top:12px;">
                  <button class="btn-danger" type="button" onclick="logoutDevice()">Logout / Ganti Nomor</button>
                  <button class="btn-blue" type="button" onclick="regenKey()">Regenerate API Key</button>
                  <button class="btn-danger" type="button" onclick="deleteDevice()">Hapus Device</button>
                </div>
                <div style="margin-top:14px;">
                  <label>API Key (masked)</label>
                  <div class="row" style="gap:8px;align-items:stretch;">
                    <div class="key-box" id="keyMasked" style="flex:1;margin:0;">—</div>
                    <button class="btn-blue" type="button" style="white-space:nowrap;" onclick="copyApiKey()" id="copyKeyBtn">
                      Salin Key
                    </button>
                  </div>
                  <div id="keyReveal" class="hidden" style="margin-top:8px;">
                    <label>API Key lengkap</label>
                    <div class="row" style="gap:8px;align-items:stretch;">
                      <div class="key-box" id="keyFull" style="flex:1;margin:0;"></div>
                      <button class="btn-secondary" type="button" style="white-space:nowrap;" onclick="copyTextFrom('keyFull')">
                        Salin
                      </button>
                    </div>
                    <p class="muted" id="copyKeyStatus" style="margin-top:6px;"></p>
                  </div>
                </div>
              </div>
              <div>
                <div class="tabs">
                  <button type="button" class="tab-btn active" id="tabVerifBtn" onclick="switchSendTab('verif')">
                    Notifikasi Verifikasi
                  </button>
                  <button type="button" class="tab-btn" id="tabCustomBtn" onclick="switchSendTab('custom')">
                    Pesan Bebas
                  </button>
                </div>

                <form id="verifForm" onsubmit="sendVerificationTest(event)">
                  <div class="row-2">
                    <div>
                      <label>Nomor WA Tujuan</label>
                      <input type="text" id="vPhone" placeholder="081234567890" required />
                    </div>
                    <div>
                      <label>Jenis Notifikasi</label>
                      <select id="vType" onchange="toggleVerifFields()">
                        <option value="request">Permintaan Verifikasi Baru</option>
                        <option value="result">Hasil Verifikasi</option>
                      </select>
                    </div>
                  </div>
                  <div class="row-2">
                    <div>
                      <label>Nama Penerima</label>
                      <input type="text" id="vNama" value="dr. Budi Santoso" required />
                    </div>
                    <div>
                      <label>Nomor Pengajuan / Tiket</label>
                      <input type="text" id="vNomor" value="VER-2026-0089" required />
                    </div>
                  </div>
                  <div class="row-2">
                    <div>
                      <label>Perihal / Kategori Verifikasi</label>
                      <input type="text" id="vJenis" value="Verifikasi Hasil Laboratorium" required />
                    </div>
                    <div id="vActorWrap">
                      <label id="vActorLabel">Nama Pemohon</label>
                      <input type="text" id="vActor" value="Andi Pratama" required />
                    </div>
                  </div>
                  <div id="vStatusWrap" style="display:none;">
                    <label>Status Hasil Verifikasi</label>
                    <select id="vStatus">
                      <option value="disetujui">Disetujui (Approved)</option>
                      <option value="revisi">Perlu Perbaikan (Revisi)</option>
                      <option value="ditolak">Ditolak (Rejected)</option>
                    </select>
                  </div>
                  <label>Catatan / Keterangan Tambahan (Opsional)</label>
                  <input type="text" id="vCatatan" value="Mohon segera ditindaklanjuti." />
                  <button type="submit" class="primary" id="vBtn">
                    Kirim Notifikasi Verifikasi
                  </button>
                  <div id="vAlert" class="alert hidden"></div>
                </form>

                <form id="customForm" class="hidden" onsubmit="sendTestMessage(event)">
                  <label for="phone">Nomor Tujuan (08xx / 628xx)</label>
                  <input type="text" id="phone" placeholder="Contoh: 081234567890" required />
                  <label for="message">Isi Pesan (otomatis ditambah Ref ID & waktu)</label>
                  <textarea id="message" rows="3" required>Halo! Ini pesan percobaan dari WA Baileys Gateway</textarea>
                  <button type="submit" class="primary" id="sendBtn">Kirim Pesan Sekarang</button>
                  <div id="sendAlert" class="alert hidden"></div>
                </form>

                <h2 style="margin-top:20px;">Log pesan</h2>
                <div id="msgList" class="msg-list muted">Belum ada aktivitas.</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Users (super admin) -->
      <section id="usersSection" class="hidden">
        <div class="card">
          <h2>Manajemen Admin</h2>
          <p class="muted" style="margin-bottom:12px;">Hanya super admin. Admin baru punya device sendiri.</p>
          <form class="row-2" onsubmit="createAdmin(event)">
            <div>
              <label>Nama</label>
              <input id="adminName" required />
            </div>
            <div>
              <label>Email</label>
              <input type="email" id="adminEmail" required />
            </div>
            <div>
              <label>Password</label>
              <input type="password" id="adminPassword" required minlength="8" />
            </div>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn-primary" type="submit" style="width:100%;">Tambah Admin</button>
            </div>
          </form>
          <div id="adminAlert" class="alert hidden"></div>
          <div id="usersList" style="margin-top:16px;"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let currentUser = null;
    let selectedDeviceId = null;
    let pollTimer = null;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    function show(el, on = true) {
      document.getElementById(el).classList.toggle('hidden', !on);
    }

    function setAlert(id, ok, msg) {
      const el = document.getElementById(id);
      el.className = 'alert ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function showAuthTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    }

    async function boot() {
      const { data: bootData } = await api('/api/auth/bootstrap');
      const regOpen = Boolean(bootData.registrationOpen);
      document.getElementById('tabRegister').classList.toggle('hidden', !regOpen);
      document.getElementById('authHint').textContent = regOpen
        ? 'Belum ada pengguna. Daftarkan Super Admin pertama (pendaftaran akan ditutup setelahnya).'
        : 'Login untuk mengelola device WhatsApp.';

      const { res, data } = await api('/api/auth/me');
      if (res.ok && data.user) {
        currentUser = data.user;
        enterApp();
      } else {
        show('authView', true);
        show('appView', false);
        if (regOpen) showAuthTab('register');
      }
    }

    function enterApp() {
      show('authView', false);
      show('appView', true);
      document.getElementById('userLabel').textContent =
        `${currentUser.name} · ${currentUser.email} · ${currentUser.role}`;
      document.getElementById('usersNavBtn').classList.toggle(
        'hidden',
        currentUser.role !== 'super_admin'
      );
      showSection('devices');
      loadDevices();
    }

    function showSection(name) {
      show('devicesSection', name === 'devices');
      show('usersSection', name === 'users');
      if (name === 'users') loadUsers();
    }

    async function doRegister(e) {
      e.preventDefault();
      const { res, data } = await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
        }),
      });
      if (!res.ok) return setAlert('regAlert', false, data.message || 'Gagal daftar');
      currentUser = data.user;
      if (data.migratedDevice?.apiKey) {
        alert('Device lama dimigrasi.\nAPI Key:\n' + data.migratedDevice.apiKey);
      }
      enterApp();
    }

    async function doLogin(e) {
      e.preventDefault();
      const { res, data } = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        }),
      });
      if (!res.ok) return setAlert('loginAlert', false, data.message || 'Gagal login');
      currentUser = data.user;
      enterApp();
    }

    async function doLogout() {
      await api('/api/auth/logout', { method: 'POST' });
      currentUser = null;
      selectedDeviceId = null;
      if (pollTimer) clearInterval(pollTimer);
      location.reload();
    }

    async function loadDevices() {
      const { data } = await api('/api/devices');
      const grid = document.getElementById('deviceGrid');
      if (!data.devices?.length) {
        grid.innerHTML = '<p class="muted">Belum ada device. Klik “Tambah Device”.</p>';
        return;
      }
      grid.innerHTML = data.devices.map((d) => `
        <div class="card device-card ${d.id === selectedDeviceId ? 'active' : ''}" onclick="selectDevice('${d.id}')">
          <div class="row" style="justify-content:space-between;">
            <strong>${escapeHtml(d.name)}</strong>
            <span class="badge ${d.status}">${d.status}</span>
          </div>
          <p class="muted" style="margin-top:8px;">
            ${d.phone ? '+' + d.phone : 'Belum terhubung'}
            ${d.ownerEmail && currentUser.role === 'super_admin' ? '<br/>Owner: ' + escapeHtml(d.ownerEmail) : ''}
          </p>
        </div>
      `).join('');
    }

    async function createDevice() {
      const name = prompt('Nama device', 'WhatsApp ' + new Date().toLocaleDateString('id-ID'));
      if (!name) return;
      const { res, data } = await api('/api/devices', {
        method: 'POST',
        body: JSON.stringify({ name }),
      });
      if (!res.ok) return alert(data.message || 'Gagal membuat device');
      if (data.device?.apiKey) {
        alert('Device dibuat. Simpan API Key ini:\n\n' + data.device.apiKey);
      }
      await loadDevices();
      selectDevice(data.device.id);
    }

    async function selectDevice(id) {
      selectedDeviceId = id;
      show('deviceDetail', true);
      await loadDevices();
      await pollDevice();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollDevice, 3000);
    }

    async function pollDevice() {
      if (!selectedDeviceId) return;
      const { res, data } = await api(`/api/devices/${selectedDeviceId}/status`);
      if (!res.ok) return;
      const { data: detail } = await api(`/api/devices/${selectedDeviceId}`);
      const d = detail.device || {};
      document.getElementById('detailTitle').textContent = d.name || 'Device';
      const badge = document.getElementById('detailBadge');
      badge.className = 'badge ' + data.status;
      badge.textContent = data.status;
      document.getElementById('keyMasked').textContent = d.apiKeyMasked || '—';

      const qrBox = document.getElementById('qrBox');
      if (data.status === 'scan_qr' && data.qr) {
        qrBox.innerHTML = `<img src="${data.qr}" alt="QR" /><p class="muted" style="margin-top:8px;">Scan dengan WhatsApp → Perangkat Tertaut</p>`;
      } else if (data.status === 'connected' && data.user) {
        qrBox.innerHTML = `<div style="font-size:2.5rem;">✅</div><p><strong>${escapeHtml(data.user.name)}</strong><br/>+${escapeHtml(data.user.phone)}</p>`;
      } else {
        qrBox.innerHTML = `<p class="muted">Status: ${escapeHtml(data.status)}</p>`;
      }

      const { data: msgs } = await api(`/api/devices/${selectedDeviceId}/messages`);
      const list = document.getElementById('msgList');
      if (!msgs.messages?.length) {
        list.innerHTML = '<p class="muted">Belum ada aktivitas.</p>';
      } else {
        list.innerHTML = msgs.messages.map((m) => `
          <div class="msg-item">
            <div class="row" style="justify-content:space-between;">
              <strong>${m.fromMe ? '📤' : '📥'} ${escapeHtml(m.from)}</strong>
              <span class="muted">${new Date(m.timestamp).toLocaleTimeString('id-ID')}</span>
            </div>
            <div>${escapeHtml(m.text)}</div>
          </div>
        `).join('');
      }
    }

    async function logoutDevice() {
      if (!selectedDeviceId || !confirm('Reset sesi WhatsApp device ini?')) return;
      await api(`/api/devices/${selectedDeviceId}/logout`, { method: 'POST' });
      pollDevice();
    }

    async function copyToClipboard(text) {
      if (!text) return false;
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }
    }

    function copyTextFrom(elId) {
      const text = document.getElementById(elId)?.textContent?.trim();
      copyToClipboard(text).then((ok) => {
        const status = document.getElementById('copyKeyStatus');
        status.textContent = ok ? 'API key tersalin ke clipboard.' : 'Gagal menyalin.';
        status.style.color = ok ? 'var(--green)' : 'var(--red)';
      });
    }

    async function copyApiKey() {
      if (!selectedDeviceId) return;
      const btn = document.getElementById('copyKeyBtn');
      btn.disabled = true;
      btn.textContent = 'Menyalin…';
      try {
        const { res, data } = await api(
          `/api/devices/${selectedDeviceId}/reveal-key`,
          { method: 'POST' }
        );
        if (!res.ok || !data.device?.apiKey) {
          alert(data.message || 'Gagal mengambil API key');
          return;
        }
        document.getElementById('keyReveal').classList.remove('hidden');
        document.getElementById('keyFull').textContent = data.device.apiKey;
        document.getElementById('keyMasked').textContent = data.device.apiKeyMasked;
        const ok = await copyToClipboard(data.device.apiKey);
        const status = document.getElementById('copyKeyStatus');
        status.textContent = ok
          ? 'API key tersalin ke clipboard.'
          : 'Key ditampilkan — salin manual jika perlu.';
        status.style.color = ok ? 'var(--green)' : 'var(--amber)';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salin Key';
      }
    }

    async function regenKey() {
      if (!selectedDeviceId || !confirm('Generate API key baru? Key lama langsung invalid.')) return;
      const { res, data } = await api(`/api/devices/${selectedDeviceId}/regenerate-key`, { method: 'POST' });
      if (!res.ok) return alert(data.message || 'Gagal');
      document.getElementById('keyReveal').classList.remove('hidden');
      document.getElementById('keyFull').textContent = data.device.apiKey;
      document.getElementById('keyMasked').textContent = data.device.apiKeyMasked;
      const ok = await copyToClipboard(data.device.apiKey);
      const status = document.getElementById('copyKeyStatus');
      status.textContent = ok
        ? 'Key baru digenerate dan tersalin ke clipboard.'
        : 'Key baru digenerate — salin sekarang.';
      status.style.color = ok ? 'var(--green)' : 'var(--amber)';
    }

    async function deleteDevice() {
      if (!selectedDeviceId || !confirm('Hapus device ini permanen?')) return;
      await api(`/api/devices/${selectedDeviceId}`, { method: 'DELETE' });
      selectedDeviceId = null;
      if (pollTimer) clearInterval(pollTimer);
      show('deviceDetail', false);
      loadDevices();
    }

    function switchSendTab(tab) {
      const isVerif = tab === 'verif';
      document.getElementById('verifForm').classList.toggle('hidden', !isVerif);
      document.getElementById('customForm').classList.toggle('hidden', isVerif);
      document.getElementById('tabVerifBtn').classList.toggle('active', isVerif);
      document.getElementById('tabCustomBtn').classList.toggle('active', !isVerif);
    }

    function toggleVerifFields() {
      const type = document.getElementById('vType').value;
      document.getElementById('vStatusWrap').style.display =
        type === 'result' ? 'block' : 'none';
      document.getElementById('vActorLabel').textContent =
        type === 'result' ? 'Diverifikasi Oleh' : 'Nama Pemohon';
    }

    async function sendVerificationTest(e) {
      e.preventDefault();
      if (!selectedDeviceId) return alert('Pilih device dulu');
      const btn = document.getElementById('vBtn');
      const type = document.getElementById('vType').value;
      btn.disabled = true;
      btn.textContent = 'Mengetik & Mengirim...';
      try {
        const { res, data } = await api(
          `/api/devices/${selectedDeviceId}/send-verification`,
          {
            method: 'POST',
            body: JSON.stringify({
              phone: document.getElementById('vPhone').value,
              type,
              nama: document.getElementById('vNama').value,
              nomor: document.getElementById('vNomor').value,
              jenis: document.getElementById('vJenis').value,
              pemohon: document.getElementById('vActor').value,
              verifikator: document.getElementById('vActor').value,
              status: document.getElementById('vStatus').value,
              catatan: document.getElementById('vCatatan').value,
            }),
          }
        );
        setAlert('vAlert', res.ok && data.success, data.message || (res.ok ? 'Terkirim' : 'Gagal'));
        pollDevice();
      } catch (_) {
        setAlert('vAlert', false, 'Gagal menghubungi server');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Notifikasi Verifikasi';
      }
    }

    async function sendTestMessage(e) {
      e.preventDefault();
      if (!selectedDeviceId) return alert('Pilih device dulu');
      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Mengetik & Mengirim...';
      try {
        const { res, data } = await api(
          `/api/devices/${selectedDeviceId}/send-message`,
          {
            method: 'POST',
            body: JSON.stringify({
              phone: document.getElementById('phone').value,
              message: document.getElementById('message').value,
            }),
          }
        );
        setAlert('sendAlert', res.ok && data.success, data.message || (res.ok ? 'Terkirim' : 'Gagal'));
        pollDevice();
      } catch (_) {
        setAlert('sendAlert', false, 'Gagal menghubungi server');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Pesan Sekarang';
      }
    }

    async function loadUsers() {
      const { data } = await api('/api/users');
      const el = document.getElementById('usersList');
      el.innerHTML = (data.users || []).map((u) => `
        <div class="card" style="padding:12px;margin-bottom:8px;">
          <div class="row" style="justify-content:space-between;">
            <div>
              <strong>${escapeHtml(u.name)}</strong>
              <div class="muted">${escapeHtml(u.email)} · ${u.role}</div>
            </div>
            ${u.role !== 'super_admin' ? `<button class="btn-danger" type="button" onclick="deleteAdmin('${u.id}')">Hapus</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function createAdmin(e) {
      e.preventDefault();
      const { res, data } = await api('/api/users', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('adminName').value,
          email: document.getElementById('adminEmail').value,
          password: document.getElementById('adminPassword').value,
        }),
      });
      setAlert('adminAlert', res.ok, data.message || (res.ok ? 'Admin dibuat' : 'Gagal'));
      if (res.ok) {
        e.target.reset();
        loadUsers();
      }
    }

    async function deleteAdmin(id) {
      if (!confirm('Hapus admin ini?')) return;
      await api(`/api/users/${id}`, { method: 'DELETE' });
      loadUsers();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    boot();
  </script>
</body>
</html>
