<VirtualHost *:80>
    ServerName wa.rusabyte.co.id

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3012/
    ProxyPassReverse / http://127.0.0.1:3012/

    ErrorLog ${APACHE_LOG_DIR}/wa.rusabyte.co.id_error.log
    CustomLog ${APACHE_LOG_DIR}/wa.rusabyte.co.id_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =wa.rusabyte.co.id
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
